# Essential services for AppFlowy Cloud
# From the repository root, run `cp deploy.env .env` and edit .env first.
# Then run `docker compose up -d`.
# Backup is disabled by default; set APPFLOWY_BACKUP_PROFILE=backup in .env to enable it.
# See docs/docker-compose.md#backup for setup.
# Server logs are optional; see docs/docker-compose.md#server-logs.

services:
  nginx:
    restart: on-failure
    image: nginx
    networks:
      default: {}
      mcp_proxy: {}
    ports:
      - ${NGINX_PORT:-80}:80   # Disable this if you are using TLS
      - ${NGINX_TLS_PORT:-443}:443
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl/certificate.crt:/etc/nginx/ssl/certificate.crt
      - ./docker/nginx/ssl/private_key.key:/etc/nginx/ssl/private_key.key

  # You do not need this if you have configured to use your own s3 file storage
  minio:
    restart: on-failure
    image: appflowyinc/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      - MINIO_BROWSER_REDIRECT_URL=${APPFLOWY_BASE_URL?:err}/minio
      - MINIO_ROOT_USER=${APPFLOWY_S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${APPFLOWY_S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio_data:/data

  postgres:
    restart: on-failure
    # Pinned to the build the Backup image contains. Backup restores every snapshot into its own
    # copy of this PostgreSQL, which rejects a database from a newer minor release. Move this pin
    # only together with a Backup image built for the new release.
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - PGPORT=${POSTGRES_PORT:-5432}
    command: [ "postgres", "-c", "port=${POSTGRES_PORT:-5432}" ]
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-p", "${POSTGRES_PORT:-5432}" ]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    restart: on-failure
    image: redis

  gotrue:
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: "curl --fail http://127.0.0.1:9999/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    image: appflowyinc/gotrue:${GOTRUE_VERSION:-0.20.6@sha256:93a657d44bc886899a0bd09e693e423c7be232c76315e4467d88bd86095297d5}
    environment:
      # There are a lot of options to configure GoTrue. You can reference the example config:
      # https://github.com/supabase/auth/blob/master/example.env
      # The initial GoTrue Admin user to create, if not already exists.
      - GOTRUE_ADMIN_EMAIL=${GOTRUE_ADMIN_EMAIL}
      # The initial GoTrue Admin user password to create, if not already exists.
      # If the user already exists, the update will be skipped.
      - GOTRUE_ADMIN_PASSWORD=${GOTRUE_ADMIN_PASSWORD}
      - GOTRUE_DISABLE_SIGNUP=${GOTRUE_DISABLE_SIGNUP:-false}
      - GOTRUE_SITE_URL=appflowy-flutter://                           # redirected to AppFlowy application
      - GOTRUE_URI_ALLOW_LIST=** # adjust restrict if necessary
      - GOTRUE_JWT_SECRET=${GOTRUE_JWT_SECRET}                        # authentication secret
      - GOTRUE_JWT_AUD=${GOTRUE_JWT_AUD:-}
      - GOTRUE_JWT_EXP=${GOTRUE_JWT_EXP}
      # Without this environment variable, the createuser command will create an admin
      # with the `admin` role as opposed to `supabase_admin`
      - GOTRUE_JWT_ADMIN_GROUP_NAME=supabase_admin
      - GOTRUE_DB_DRIVER=postgres
      - API_EXTERNAL_URL=${API_EXTERNAL_URL}
      - DATABASE_URL=${GOTRUE_DATABASE_URL}
      - PORT=9999
      - GOTRUE_SMTP_HOST=${GOTRUE_SMTP_HOST}                          # e.g. smtp.gmail.com
      - GOTRUE_SMTP_PORT=${GOTRUE_SMTP_PORT}                          # e.g. 465
      - GOTRUE_SMTP_USER=${GOTRUE_SMTP_USER}                          # email sender, e.g. noreply@appflowy.io
      - GOTRUE_SMTP_PASS=${GOTRUE_SMTP_PASS}                          # email password
      - GOTRUE_MAILER_URLPATHS_CONFIRMATION=/gotrue/verify
      - GOTRUE_MAILER_URLPATHS_INVITE=/gotrue/verify
      - GOTRUE_MAILER_URLPATHS_RECOVERY=/gotrue/verify
      - GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE=/gotrue/verify
      - GOTRUE_MAILER_TEMPLATES_MAGIC_LINK=${GOTRUE_MAILER_TEMPLATES_MAGIC_LINK}
      - GOTRUE_SMTP_ADMIN_EMAIL=${GOTRUE_SMTP_ADMIN_EMAIL}                # email with admin privileges e.g. internal@appflowy.io
      - GOTRUE_SMTP_MAX_FREQUENCY=${GOTRUE_SMTP_MAX_FREQUENCY:-1ns}       # set to 1ns for running tests
      - GOTRUE_RATE_LIMIT_EMAIL_SENT=${GOTRUE_RATE_LIMIT_EMAIL_SENT:-100} # number of email sendable per minute
      - GOTRUE_MAILER_AUTOCONFIRM=${GOTRUE_MAILER_AUTOCONFIRM:-false}     # change this to true to skip email confirmation
      # Google OAuth config
      - GOTRUE_EXTERNAL_GOOGLE_ENABLED=${GOTRUE_EXTERNAL_GOOGLE_ENABLED}
      - GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID=${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID}
      - GOTRUE_EXTERNAL_GOOGLE_SECRET=${GOTRUE_EXTERNAL_GOOGLE_SECRET}
      - GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI=${GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI}
      # GITHUB OAuth config
      - GOTRUE_EXTERNAL_GITHUB_ENABLED=${GOTRUE_EXTERNAL_GITHUB_ENABLED}
      - GOTRUE_EXTERNAL_GITHUB_CLIENT_ID=${GOTRUE_EXTERNAL_GITHUB_CLIENT_ID}
      - GOTRUE_EXTERNAL_GITHUB_SECRET=${GOTRUE_EXTERNAL_GITHUB_SECRET}
      - GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI=${GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI}
      # Discord OAuth config
      - GOTRUE_EXTERNAL_DISCORD_ENABLED=${GOTRUE_EXTERNAL_DISCORD_ENABLED}
      - GOTRUE_EXTERNAL_DISCORD_CLIENT_ID=${GOTRUE_EXTERNAL_DISCORD_CLIENT_ID}
      - GOTRUE_EXTERNAL_DISCORD_SECRET=${GOTRUE_EXTERNAL_DISCORD_SECRET}
      - GOTRUE_EXTERNAL_DISCORD_REDIRECT_URI=${GOTRUE_EXTERNAL_DISCORD_REDIRECT_URI}
      # SAML 2.0 OAuth config
      - GOTRUE_SAML_ENABLED=${GOTRUE_SAML_ENABLED}
      - GOTRUE_SAML_PRIVATE_KEY=${GOTRUE_SAML_PRIVATE_KEY}
      # Delegated row access for a dashboard backend (docs/DELEGATED_ACCESS.md). There is no
      # switch: it is off while the first four settings are empty, and giving any of them a
      # value turns it on. GoTrue then requires the tenant, provider and signing keys. The two
      # limits repeat GoTrue's defaults because it rejects a limit that is present but empty.
      - GOTRUE_TOKEN_EXCHANGE_TENANT_ID=${GOTRUE_TOKEN_EXCHANGE_TENANT_ID:-}
      - GOTRUE_TOKEN_EXCHANGE_PROVIDER=${GOTRUE_TOKEN_EXCHANGE_PROVIDER:-}
      - GOTRUE_TOKEN_EXCHANGE_CLIENTS=${GOTRUE_TOKEN_EXCHANGE_CLIENTS:-}
      - GOTRUE_TOKEN_EXCHANGE_SIGNING_KEYS=${GOTRUE_TOKEN_EXCHANGE_SIGNING_KEYS:-}
      - GOTRUE_TOKEN_EXCHANGE_RATE_LIMIT=${GOTRUE_TOKEN_EXCHANGE_RATE_LIMIT:-150}
      - GOTRUE_TOKEN_EXCHANGE_MAX_CONCURRENT=${GOTRUE_TOKEN_EXCHANGE_MAX_CONCURRENT:-8}

  appflowy_cloud:
    # Restore writes only the selected bucket, Redis database and search directory here.
    env_file:
      - path: ./docker/backup/source-appflowy_cloud.env
      - path: ./backup-ops/runtime/selection-appflowy_cloud.env
        required: false
        format: raw
    restart: on-failure
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - APPFLOWY_ENVIRONMENT=production
      - APPFLOWY_DATABASE_URL=${APPFLOWY_DATABASE_URL}
      - APPFLOWY_GOTRUE_JWT_SECRET=${GOTRUE_JWT_SECRET}
      - APPFLOWY_GOTRUE_BASE_URL=${APPFLOWY_GOTRUE_BASE_URL}
      - APPFLOWY_S3_CREATE_BUCKET=${APPFLOWY_S3_CREATE_BUCKET}
      - APPFLOWY_S3_USE_MINIO=${APPFLOWY_S3_USE_MINIO}
      - APPFLOWY_S3_MINIO_URL=${APPFLOWY_S3_MINIO_URL}
      - APPFLOWY_S3_ACCESS_KEY=${APPFLOWY_S3_ACCESS_KEY}
      - APPFLOWY_S3_SECRET_KEY=${APPFLOWY_S3_SECRET_KEY}
      - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION}
      - APPFLOWY_S3_PRESIGNED_URL_ENDPOINT=${APPFLOWY_S3_PRESIGNED_URL_ENDPOINT}
      - APPFLOWY_MAILER_SMTP_HOST=${APPFLOWY_MAILER_SMTP_HOST}
      - APPFLOWY_MAILER_SMTP_PORT=${APPFLOWY_MAILER_SMTP_PORT}
      - APPFLOWY_MAILER_SMTP_USERNAME=${APPFLOWY_MAILER_SMTP_USERNAME}
      - APPFLOWY_MAILER_SMTP_EMAIL=${APPFLOWY_MAILER_SMTP_EMAIL}
      - APPFLOWY_MAILER_SMTP_PASSWORD=${APPFLOWY_MAILER_SMTP_PASSWORD}
      - APPFLOWY_MAILER_SMTP_TLS_KIND=${APPFLOWY_MAILER_SMTP_TLS_KIND}
      - APPFLOWY_ACCESS_CONTROL=${APPFLOWY_ACCESS_CONTROL}
      - APPFLOWY_DATABASE_MAX_CONNECTIONS=${APPFLOWY_DATABASE_MAX_CONNECTIONS}
      - AI_SERVER_HOST=${AI_SERVER_HOST}
      - AI_SERVER_PORT=${AI_SERVER_PORT}
      - AI_OPENAI_API_KEY=${AI_OPENAI_API_KEY}
      - APPFLOWY_WEB_URL=${APPFLOWY_WEB_URL:-${APPFLOWY_BASE_URL}}
      - APPFLOWY_BASE_URL=${APPFLOWY_BASE_URL}
      # Advertised as server-info `mcp_url` whether MCP is on or off, so AppFlowy Web and Desktop
      # find MCP and members can disconnect. Cloud knows MCP only from this value and never falls
      # back to APPFLOWY_BASE_URL: blank, it advertises no MCP, and Web and Desktop hide MCP.
      - APPFLOWY_MCP_BASE_URL=${APPFLOWY_MCP_BASE_URL-${APPFLOWY_BASE_URL}}
      # The same MCP policy defaults as appflowy_mcp's: Cloud resolves the policy too, for
      # server-info and the Admin console's MCP page (see deploy.env).
      - APPFLOWY_MCP_ALLOWED_EMAIL_DOMAINS=${APPFLOWY_MCP_ALLOWED_EMAIL_DOMAINS:-}
      - APPFLOWY_MCP_ALLOWED_EMAILS=${APPFLOWY_MCP_ALLOWED_EMAILS:-}
      - APPFLOWY_MCP_OAUTH_IP_RATE_LIMIT_PER_MINUTE=${APPFLOWY_MCP_OAUTH_IP_RATE_LIMIT_PER_MINUTE:-}
      # Audit fallback until Admin -> Audit Log saves the switch. appflowy_mcp resolves it too
      # and receives the same value (see deploy.env).
      - APPFLOWY_AUDIT_ENABLE=${APPFLOWY_AUDIT_ENABLE:-}
      # Accept the tokens GoTrue exchanges for a dashboard on the database row API. Cloud
      # starts with both empty (off) or both set, never with one (docs/DELEGATED_ACCESS.md).
      - APPFLOWY_TOKEN_EXCHANGE_ISSUER=${APPFLOWY_TOKEN_EXCHANGE_ISSUER:-}
      - APPFLOWY_TOKEN_EXCHANGE_AUDIENCE=${APPFLOWY_TOKEN_EXCHANGE_AUDIENCE:-}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - ASSEMBLYAI_API_BASE=${ASSEMBLYAI_API_BASE}
      - ASSEMBLYAI_STREAMING_API_BASE=${ASSEMBLYAI_STREAMING_API_BASE}
      # Fixed bootstrap compatibility for older Cloud images; current Cloud uses URL and health.
      - APPFLOWY_SEARCH_ENABLED=true
      # Preserve an explicitly empty URL when Search is deliberately unconfigured.
      - APPFLOWY_SEARCH_SERVICE_URL=${APPFLOWY_SEARCH_SERVICE_URL-http://appflowy_search:4002}
      - APPFLOWY_SEARCH_REQUEST_TIMEOUT_SECS=${APPFLOWY_SEARCH_REQUEST_TIMEOUT_SECS:-10}
      - AI_ENABLED=${AI_ENABLED:-true}
      # SIGNUP_WHITELIST_ENABLED=true requires GOTRUE_DISABLE_SIGNUP=false on
      # the gotrue service. The whitelist is enforced by GoTrue's
      # BeforeUserCreated PG hook, which never runs when signup is globally
      # disabled — leaving the whitelist a no-op. Set GOTRUE_DISABLE_SIGNUP=false
      # and rely on the whitelist + invitations to gate who can sign up.
      - SIGNUP_WHITELIST_ENABLED=${SIGNUP_WHITELIST_ENABLED:-false}
      - GUEST_INVITES_REQUIRE_ADMIN_APPROVAL=${GUEST_INVITES_REQUIRE_ADMIN_APPROVAL:-false}
      # No collector dependency or startup probe when server logs are disabled.
      - APPFLOWY_SERVER_LOGS_URL=${APPFLOWY_SERVER_LOGS_PROFILE:+http://appflowy_log_collector:8088}
      - APPFLOWY_SERVER_LOGS_TOKEN=${APPFLOWY_SERVER_LOGS_PROFILE:+${APPFLOWY_SERVER_LOGS_TOKEN:-}}
    image: appflowyinc/appflowy_cloud:0.21.8@sha256:1d63b831255698326be150c1945a2a63e396ff872fb8f741bbca936a2cac3b6f
    healthcheck:
      test: "curl --fail http://127.0.0.1:8000/api/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      gotrue:
        condition: service_healthy

  admin_frontend:
    restart: on-failure
    image: appflowyinc/admin_frontend:0.20.4@sha256:10d136fc7c476346c76c7195b7833dc0f234a3418f35aca0f52cc4e8d95f3567
    environment:
      - APPFLOWY_GOTRUE_BASE_URL=${APPFLOWY_GOTRUE_BASE_URL:-http://gotrue:9999}
      - APPFLOWY_BASE_URL=${APPFLOWY_BASE_URL:-http://appflowy_cloud:8000}

    depends_on:
      gotrue:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy

  ai:
    # Restore writes only the selected bucket, Redis database and search directory here.
    env_file:
      - path: ./docker/backup/source-ai.env
      - path: ./backup-ops/runtime/selection-ai.env
        required: false
        format: raw
    restart: on-failure
    image: appflowyinc/appflowy_ai:0.21.8@sha256:e1f93bf91152d8457304747f126a4ff3699ad3fb5adad302ce33f3fd41d14499
    environment:
      - AI_SERVER_PORT=${AI_SERVER_PORT}
      - OPENAI_API_KEY=${AI_OPENAI_API_KEY}
      - DEFAULT_AI_MODEL=gpt-4.1-mini # Make sure the model is available in your OpenAI account
      - DEFAULT_AI_COMPLETION_MODEL=gpt-4.1-mini # Make sure the model is available in your OpenAI account
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-}
      - APPFLOWY_S3_ACCESS_KEY=${APPFLOWY_S3_ACCESS_KEY}
      - APPFLOWY_S3_SECRET_KEY=${APPFLOWY_S3_SECRET_KEY}
      - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION}
      - AI_DATABASE_URL=${APPFLOWY_DATABASE_URL}
      - AI_USE_MINIO=${APPFLOWY_S3_USE_MINIO}
      - AI_MINIO_URL=${APPFLOWY_S3_MINIO_URL}
      - AI_APPFLOWY_HOST=${APPFLOWY_BASE_URL}
      - APPFLOWY_GOTRUE_JWT_SECRET=${GOTRUE_JWT_SECRET}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy

  appflowy_worker:
    # Restore writes only the selected bucket, Redis database and search directory here.
    env_file:
      - path: ./docker/backup/source-appflowy_worker.env
      - path: ./backup-ops/runtime/selection-appflowy_worker.env
        required: false
        format: raw
    restart: on-failure
    image: appflowyinc/appflowy_worker:0.21.8@sha256:45c801f7aa2e5f93639738c2b1afa08f0d6074cd1c4880594eec4f0266d35bdd
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - APPFLOWY_ENVIRONMENT=production
      - APPFLOWY_WORKER_ENVIRONMENT=production
      - APPFLOWY_WORKER_DATABASE_URL=${APPFLOWY_WORKER_DATABASE_URL}
      - APPFLOWY_WORKER_DATABASE_NAME=${APPFLOWY_WORKER_DATABASE_NAME}
      - APPFLOWY_WORKER_IMPORT_TICK_INTERVAL=30
      - APPFLOWY_S3_USE_MINIO=${APPFLOWY_S3_USE_MINIO}
      - APPFLOWY_S3_MINIO_URL=${APPFLOWY_S3_MINIO_URL}
      - APPFLOWY_S3_ACCESS_KEY=${APPFLOWY_S3_ACCESS_KEY}
      - APPFLOWY_S3_SECRET_KEY=${APPFLOWY_S3_SECRET_KEY}
      - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION}
      - APPFLOWY_MAILER_SMTP_HOST=${APPFLOWY_MAILER_SMTP_HOST}
      - APPFLOWY_MAILER_SMTP_PORT=${APPFLOWY_MAILER_SMTP_PORT}
      - APPFLOWY_MAILER_SMTP_USERNAME=${APPFLOWY_MAILER_SMTP_USERNAME}
      - APPFLOWY_MAILER_SMTP_EMAIL=${APPFLOWY_MAILER_SMTP_EMAIL}
      - APPFLOWY_MAILER_SMTP_PASSWORD=${APPFLOWY_MAILER_SMTP_PASSWORD}
      - APPFLOWY_MAILER_SMTP_TLS_KIND=${APPFLOWY_MAILER_SMTP_TLS_KIND}
    depends_on:
      postgres:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy

  appflowy_search:
    # Restore writes only the selected bucket, Redis database and search directory here.
    env_file:
      - path: ./docker/backup/source-appflowy_search.env
      - path: ./backup-ops/runtime/selection-appflowy_search.env
        required: false
        format: raw
    restart: on-failure
    image: appflowyinc/appflowy_search:0.21.8@sha256:83f8632116e4c22d04253d6fedf068a6f2d856fc80ad434be560189bc5037d6f
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - APPFLOWY_SEARCH_HOST=${APPFLOWY_SEARCH_HOST:-[::]}
      - APPFLOWY_SEARCH_PORT=${APPFLOWY_SEARCH_PORT:-4002}
      - APPFLOWY_SEARCH_DATABASE_URL=${APPFLOWY_DATABASE_URL}
      - AI_OPENAI_API_KEY=${AI_OPENAI_API_KEY}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-}
      # S3 / MinIO — required for /api/admin/search/.../rebuild to read collab
      # blobs offloaded by appflowy_cloud. Without these the service falls back
      # to MinIO defaults at localhost:9000 and the rebuild API returns
      # "collab store is not configured; cannot rebuild documents".
      - APPFLOWY_S3_USE_MINIO=${APPFLOWY_S3_USE_MINIO}
      - APPFLOWY_S3_MINIO_URL=${APPFLOWY_S3_MINIO_URL}
      - APPFLOWY_S3_ACCESS_KEY=${APPFLOWY_S3_ACCESS_KEY}
      - APPFLOWY_S3_SECRET_KEY=${APPFLOWY_S3_SECRET_KEY}
      - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION}
      - APPFLOWY_BACKGROUND_INDEXER_ENABLED=true
      - APPFLOWY_KEYWORD_SEARCH_ENABLED=${APPFLOWY_KEYWORD_SEARCH_ENABLED:-true}
      - APPFLOWY_KEYWORD_WORKER_ENABLED=true
      - APPFLOWY_KEYWORD_INDEX_MAP_SIZE_BYTES=${APPFLOWY_KEYWORD_INDEX_MAP_SIZE_BYTES:-2147483648}
      - APPFLOWY_GOTRUE_JWT_SECRET=${GOTRUE_JWT_SECRET}
    volumes:
      - keyword_index_data:/var/lib/appflowy/keyword_index
    healthcheck:
      # The runtime image does not ship curl or wget. Bash's /dev/tcp support
      # keeps this an HTTP-level check without adding an image dependency.
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/$${APPFLOWY_SEARCH_PORT:-4002}
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r _ status _ <&3
          [ "$$status" = 200 ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  # AI apps (MCP). Nginx serves it on this domain: AI apps connect to
  # <APPFLOWY_MCP_BASE_URL>/mcp. The service publishes no host port.
  appflowy_mcp:
    # Restore writes only the selected bucket and Redis database here.
    env_file:
      - path: ./docker/backup/source-appflowy_mcp.env
      - path: ./backup-ops/runtime/selection-appflowy_mcp.env
        required: false
        format: raw
    restart: on-failure
    # Longer than MCP's shutdown drain: requests in flight (the 60-second request timeout plus
    # 5 s), then 5 s each for its policy watchers and audit queue. Open GET /mcp streams end at
    # once; Docker's 10-second default would kill a running tool call and queued audit events.
    # The timeouts are named in the server's services/appflowy-mcp/src/server.rs
    # (AUDIT_SHUTDOWN_TIMEOUT); ci/test_mcp_configuration.py keeps this value above the drain.
    stop_grace_period: 90s
    networks:
      default: {}
      mcp_proxy:
        aliases: [mcp-ingress]
    image: appflowyinc/appflowy_mcp:${APPFLOWY_MCP_VERSION:-0.21.8@sha256:5819778eedf4b55d894e3459733681c100c496c01b198286d2dc906e5d3293a5}
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - APPFLOWY_APPLICATION_HOST=[::]
      - APPFLOWY_APPLICATION_PORT=8002
      # Public origin without /mcp, and the OAuth issuer. When blank, MCP falls back to
      # APPFLOWY_BASE_URL, the same-domain default, for its own origin; Cloud does not, and then
      # advertises no MCP to Web and Desktop.
      - APPFLOWY_MCP_BASE_URL=${APPFLOWY_MCP_BASE_URL-${APPFLOWY_BASE_URL}}
      - APPFLOWY_BASE_URL=${APPFLOWY_BASE_URL}
      # AppFlowy Web serves the browser consent page at /oauth/mcp/authorize.
      - APPFLOWY_WEB_URL=${APPFLOWY_WEB_URL:-${APPFLOWY_BASE_URL}}
      - MCP_ALLOWED_CLIENT_IDS=${MCP_ALLOWED_CLIENT_IDS:-}
      - MCP_ALLOWED_REDIRECT_HOSTS=${MCP_ALLOWED_REDIRECT_HOSTS:-}
      # MCP is on by default and needs a One, Team or Enterprise license; only the Admin
      # console's MCP page turns it off (see deploy.env).
      # Fallbacks for the MCP email allowlist and OAuth per-IP limit; settings saved on that page
      # take precedence. Unset, the server's own defaults apply. Keep appflowy_cloud's
      # APPFLOWY_MCP_* values equal to these.
      - APPFLOWY_MCP_ALLOWED_EMAIL_DOMAINS=${APPFLOWY_MCP_ALLOWED_EMAIL_DOMAINS:-}
      - APPFLOWY_MCP_ALLOWED_EMAILS=${APPFLOWY_MCP_ALLOWED_EMAILS:-}
      - APPFLOWY_MCP_OAUTH_IP_RATE_LIMIT_PER_MINUTE=${APPFLOWY_MCP_OAUTH_IP_RATE_LIMIT_PER_MINUTE:-}
      # Only Nginx reaches the mcp-ingress alias on the dedicated proxy network.
      # An explicitly empty override makes MCP use the socket peer for audit and OAuth limits.
      - APPFLOWY_MCP_TRUSTED_PROXY_CIDRS=${APPFLOWY_MCP_TRUSTED_PROXY_CIDRS-${APPFLOWY_MCP_PROXY_SUBNET:-172.31.255.0/28}}
      # A CDN or load balancer in front of a proxy that appends to X-Forwarded-For (deploy.env).
      # Never applies behind the bundled Nginx, which replaces the header.
      - APPFLOWY_MCP_OUTER_PROXY_CIDRS=${APPFLOWY_MCP_OUTER_PROXY_CIDRS:-}
      # Plugin-directory listing settings (deploy.env); blank publishes nothing.
      - APPFLOWY_MCP_OPENAI_APPS_CHALLENGE=${APPFLOWY_MCP_OPENAI_APPS_CHALLENGE:-}
      - APPFLOWY_MCP_PRIVACY_POLICY_URL=${APPFLOWY_MCP_PRIVACY_POLICY_URL:-}
      - APPFLOWY_MCP_TERMS_OF_SERVICE_URL=${APPFLOWY_MCP_TERMS_OF_SERVICE_URL:-}
      # Allow credentialed browser calls from the public Web origin by default.
      - APPFLOWY_CORS_ALLOWED_ORIGINS=${APPFLOWY_CORS_ALLOWED_ORIGINS:-${APPFLOWY_WEB_URL:-${APPFLOWY_BASE_URL}}}
      # appflowy_cloud's audit fallback; both must agree (see deploy.env).
      - APPFLOWY_AUDIT_ENABLE=${APPFLOWY_AUDIT_ENABLE:-}
      - APPFLOWY_GOTRUE_JWT_SECRET=${GOTRUE_JWT_SECRET}
      - APPFLOWY_GOTRUE_BASE_URL=${APPFLOWY_GOTRUE_BASE_URL}
      # Two literal quotes make MCP verify GoTrue's empty audience.
      - APPFLOWY_GOTRUE_EXPECTED_AUDIENCES=${GOTRUE_JWT_AUD:-""}
      - APPFLOWY_DATABASE_URL=${APPFLOWY_DATABASE_URL}
      # MCP keeps its own small pool instead of Cloud's APPFLOWY_DATABASE_MAX_CONNECTIONS.
      - APPFLOWY_DATABASE_MAX_CONNECTIONS=${APPFLOWY_MCP_DATABASE_MAX_CONNECTIONS:-8}
      - APPFLOWY_DATABASE_MIN_CONNECTIONS=${APPFLOWY_MCP_DATABASE_MIN_CONNECTIONS:-1}
      # At most 16 concurrent tool calls per pooled connection.
      - APPFLOWY_MCP_MAX_IN_FLIGHT=${APPFLOWY_MCP_MAX_IN_FLIGHT:-128}
      # Largest request body. A tool call carries what a model writes in one response, well
      # under 1 MiB, and every call in flight holds its parsed body (at most twice this).
      - APPFLOWY_MCP_MAX_BODY_BYTES=${APPFLOWY_MCP_MAX_BODY_BYTES:-1048576}
      - APPFLOWY_S3_CREATE_BUCKET=${APPFLOWY_S3_CREATE_BUCKET}
      - APPFLOWY_S3_USE_MINIO=${APPFLOWY_S3_USE_MINIO}
      - APPFLOWY_S3_MINIO_URL=${APPFLOWY_S3_MINIO_URL}
      - APPFLOWY_S3_ACCESS_KEY=${APPFLOWY_S3_ACCESS_KEY}
      - APPFLOWY_S3_SECRET_KEY=${APPFLOWY_S3_SECRET_KEY}
      - APPFLOWY_S3_REGION=${APPFLOWY_S3_REGION}
      - APPFLOWY_S3_PRESIGNED_URL_ENDPOINT=${APPFLOWY_S3_PRESIGNED_URL_ENDPOINT}
      - APPFLOWY_COLLAB_S3_THRESHOLD=${APPFLOWY_COLLAB_S3_THRESHOLD:-8000}
      # Preserve an explicitly empty URL when Search is deliberately unconfigured.
      - APPFLOWY_SEARCH_SERVICE_URL=${APPFLOWY_SEARCH_SERVICE_URL-http://appflowy_search:4002}
      - APPFLOWY_SEARCH_REQUEST_TIMEOUT_SECS=${APPFLOWY_SEARCH_REQUEST_TIMEOUT_SECS:-10}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/api/ready" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      gotrue:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy

  # The environment template selects the supporting settings automatically.
  appflowy_backup:
    # Restore writes only the selected bucket, Redis database and search directory here.
    env_file:
      - path: ./docker/backup/source-appflowy_backup.env
      - path: ./backup-ops/runtime/selection-appflowy_backup.env
        required: false
        format: raw
    profiles: [backup]
    image: appflowyinc/appflowy_backup:0.21.8@sha256:33af6435de4cfbb03d4fe2740f1f4d81a66d30ee88eda4e3a633f058c7422012
    restart: unless-stopped

  # The only Docker socket added for server-log viewing belongs to this isolated reader.
  # A read-only bind does not itself restrict Docker's API; the reader exposes only scoped logs.
  appflowy_log_collector:
    profiles: [server-logs]
    image: ${APPFLOWY_SERVER_LOGS_IMAGE:-appflowyinc/appflowy_log_collector:0.21.8@sha256:c12b6894dc7eec4437fedceec563b0f6281a3c5f871587229abf0b9e74f41034}
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: "0.50"
    environment:
      - APPFLOWY_SERVER_LOGS_BIND=0.0.0.0:8088
      # With no token set, Cloud and this reader derive the same credential from the JWT secret.
      - APPFLOWY_SERVER_LOGS_TOKEN=${APPFLOWY_SERVER_LOGS_TOKEN:-}
      - APPFLOWY_GOTRUE_JWT_SECRET=${GOTRUE_JWT_SECRET}
      - APPFLOWY_SERVER_LOGS_PROJECT=${COMPOSE_PROJECT_NAME}
      - APPFLOWY_SERVER_LOGS_DOCKER_SOCKET=/var/run/docker.sock
    volumes:
      - type: bind
        source: ${APPFLOWY_SERVER_LOGS_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "appflowy_log_collector", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  appflowy_web:
    restart: on-failure
    image: appflowyinc/appflowy_web:0.20.15@sha256:c0cec44bb86af97696c104c80f9bf6f551bd546d2c12df75bb3747d5f52cf0fd
    depends_on:
      appflowy_cloud:
        condition: service_healthy
    environment:
      - APPFLOWY_BASE_URL=${APPFLOWY_BASE_URL}
      - APPFLOWY_GOTRUE_BASE_URL=${APPFLOWY_BASE_URL}/gotrue
      - APPFLOWY_WS_BASE_URL=${APPFLOWY_WEBSOCKET_BASE_URL}
      # The MCP origin. Web prefers it to server-info's `mcp_url`, which Cloud leaves out until
      # it has loaded the MCP policy.
      - APPFLOWY_MCP_BASE_URL=${APPFLOWY_MCP_BASE_URL-${APPFLOWY_BASE_URL}}
networks:
  mcp_proxy:
    internal: true
    ipam:
      config:
        - subnet: ${APPFLOWY_MCP_PROXY_SUBNET:-172.31.255.0/28}

volumes:
  postgres_data:
  minio_data:
  keyword_index_data:
