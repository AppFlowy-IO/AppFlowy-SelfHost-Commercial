name: Classify CI changes

on:
  workflow_call:
    outputs:
      kind:
        value: ${{ jobs.changes.outputs.kind }}
      run_checks:
        value: ${{ jobs.changes.outputs.run_checks }}
      run_integration:
        value: ${{ jobs.changes.outputs.run_integration }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.changes.outputs.kind }}
      run_checks: ${{ steps.changes.outputs.run_checks }}
      run_integration: ${{ steps.changes.outputs.run_integration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r docker-swarm/requirements.txt
      - name: Inspect the changed configuration fields
        id: changes
        run: python ci/changes.py
