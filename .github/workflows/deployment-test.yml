name: Deployment integration

on:
  pull_request:
  push:
    branches: [main, master, 'release/public/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVER_IMAGE_TAG: 0.20.0
  WEB_IMAGE_TAG: 0.19.30

concurrency:
  group: deployment-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/classify-changes.yml

  images:
    name: Resolve shared images and check source parity
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      USE_RELEASE_PINS: ${{ startsWith(github.head_ref, 'automation/image-updates/') || needs.changes.outputs.kind == 'web-images' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: python -m pip install -r docker-swarm/requirements.txt
      - name: Check Docker Compose compatibility
        run: python ci/configuration.py --check-tools
      - name: Check generated Swarm source matches Compose
        run: python docker-swarm/generate.py --check
      - name: Check test isolation and source rendering
        run: |
          node --test .github/scripts/cancel-merged-pr-runs.test.cjs
          python -m unittest discover -s ci -p 'test_*.py'
          python -m unittest discover -s docker-swarm/tests -p 'test_*.py'
          python -m unittest discover -s helm/appflowy-cloud/tests -p 'test_*.py'
          helm lint helm/appflowy-cloud
          helm lint helm/appflowy-cloud -f ci/helm-values.yaml
      - name: Resolve exact linux/amd64 image digests once
        run: |
          image_options=()
          if [[ "$USE_RELEASE_PINS" != true ]]; then
            image_options+=(--server-tag "$SERVER_IMAGE_TAG" --web-tag "$WEB_IMAGE_TAG")
          fi
          python ci/images.py "${image_options[@]}" --output ci-artifacts/image-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-image-lock
          path: ci-artifacts/image-lock.json
          if-no-files-found: error
          retention-days: 14

  runtime:
    name: Runtime (${{ matrix.deployment }})
    needs: [changes, images]
    if: needs.changes.outputs.run_integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - deployment: compose
          - deployment: swarm
          - deployment: helm
    env:
      DEPLOYMENT_MODE: ${{ matrix.deployment }}
      DEPLOYMENT_NAME: ${{ matrix.deployment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ci/package-lock.json
      - uses: azure/setup-helm@v4
        if: matrix.deployment == 'helm'
        with:
          version: v3.17.3
      - uses: actions/download-artifact@v4
        with:
          name: deployment-image-lock
          path: ci-artifacts
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r docker-swarm/requirements.txt
          npm ci --prefix ci
          ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Resolve the Redis image supplied by the Helm chart
        if: matrix.deployment == 'helm'
        run: python ci/images.py --helm-redis --output ci-artifacts/image-lock.json
      - name: Prepare real Kubernetes ingress
        if: matrix.deployment == 'helm'
        run: bash ci/start-kind.sh
      - name: Start the deployment and wait for core services
        run: >-
          python ci/deployment.py up --mode "$DEPLOYMENT_MODE"
          --runtime "$RUNNER_TEMP/appflowy-deployment"
          --artifacts "ci-artifacts/$DEPLOYMENT_NAME"
          --images ci-artifacts/image-lock.json
      - name: Assert workflows, browser collaboration, replacement and persistence
        run: >-
          python ci/deployment.py test --mode "$DEPLOYMENT_MODE"
          --runtime "$RUNNER_TEMP/appflowy-deployment"
          --artifacts "ci-artifacts/$DEPLOYMENT_NAME"
          --images ci-artifacts/image-lock.json
      - name: Register through AppFlowy Web and sign in from a fresh browser
        run: >-
          python ci/deployment.py register --mode "$DEPLOYMENT_MODE"
          --runtime "$RUNNER_TEMP/appflowy-deployment"
          --artifacts "ci-artifacts/$DEPLOYMENT_NAME"
          --images ci-artifacts/image-lock.json
      - name: Collect sanitized diagnostics
        if: always()
        run: >-
          python ci/deployment.py diagnostics --mode "$DEPLOYMENT_MODE"
          --runtime "$RUNNER_TEMP/appflowy-deployment"
          --artifacts "ci-artifacts/$DEPLOYMENT_NAME"
          --images ci-artifacts/image-lock.json
      - name: Remove only this runner's test deployment
        if: always()
        run: >-
          python ci/deployment.py cleanup --mode "$DEPLOYMENT_MODE"
          --runtime "$RUNNER_TEMP/appflowy-deployment"
          --artifacts "ci-artifacts/$DEPLOYMENT_NAME"
          --images ci-artifacts/image-lock.json
      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ matrix.deployment }}-${{ github.run_attempt }}
          path: ci-artifacts/${{ matrix.deployment }}/
          if-no-files-found: error
          retention-days: 14

  deployment-tests:
    name: Deployment tests
    if: always()
    needs: [changes, images, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the checks selected by the actual diff
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.run_checks }}
          RUN_INTEGRATION: ${{ needs.changes.outputs.run_integration }}
          IMAGES_RESULT: ${{ needs.images.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [[ "$RUN_CHECKS" == false ]]; then
            test "$IMAGES_RESULT" = skipped
            test "$RUNTIME_RESULT" = skipped
            echo 'Documentation-only changes: deployment checks are not needed.'
            exit 0
          fi
          test "$RUN_CHECKS" = true
          test "$IMAGES_RESULT" = success
          if [[ "$RUN_INTEGRATION" == false ]]; then
            test "$RUNTIME_RESULT" = skipped
            echo 'Web image pins validated; deployment integration is not needed.'
            exit 0
          fi
          test "$RUN_INTEGRATION" = true
          test "$RUNTIME_RESULT" = success
          echo 'Compose, single-node Swarm, and Helm runtime acceptance passed with Backup disabled.'
          echo 'External AI, semantic search, SMTP, TLS, Redis queue persistence, upgrades and multi-node/HA are outside this check.'
