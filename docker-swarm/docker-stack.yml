    deploy:
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: stop-first
    configs:
    - source: nginx_config
      target: /etc/nginx/nginx.conf
    - source: tls_certificate
      target: /etc/nginx/ssl/certificate.crt
    secrets:
    - source: tls_private_key
      target: /etc/nginx/ssl/private_key.key
      mode: 256
