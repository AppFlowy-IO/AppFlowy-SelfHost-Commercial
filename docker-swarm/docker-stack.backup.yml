# Generated by python3 docker-swarm/generate.py from root Compose Backup settings.
# Opt-in single-manager Backup. Read README.md#backup-and-restore before enabling.
# Start Backup after application readiness: docker service scale <stack>_appflowy_backup=1
version: '3.8'
services:
  appflowy_cloud:
    environment:
      APPFLOWY_BACKUP_BUCKET: ${APPFLOWY_BACKUP_BUCKET:?Set the private Backup artifact bucket}
    healthcheck:
      test: curl --fail http://127.0.0.1:8000/api/ready || exit 1
  appflowy_search:
    user: root
    entrypoint:
    - /bin/sh
    - -ec
    - 'test -d /var/lib/appflowy/keyword_index

      test ! -L /var/lib/appflowy/keyword_index

      chown -R --no-dereference 999:999 /var/lib/appflowy/keyword_index

      exec setpriv --reuid=999 --regid=999 --clear-groups "$$@"

      '
    - --
    command:
    - appflowy_search
  appflowy_backup:
    image: appflowyinc/appflowy_backup:${APPFLOWY_BACKUP_VERSION:-latest}
    environment:
      APPFLOWY_S3_BUCKET: ${APPFLOWY_S3_BUCKET}
      APPFLOWY_REDIS_URI: ${APPFLOWY_REDIS_URI}
      APPFLOWY_BACKUP_BUCKET: ${APPFLOWY_BACKUP_BUCKET:?Set the private Backup artifact bucket}
      RUST_LOG: ${RUST_LOG:-info}
      APPFLOWY_BACKUP_WORK_DIR: /var/lib/appflowy-backup/work
      APPFLOWY_DATABASE_URL: ${APPFLOWY_DATABASE_URL}
      APPFLOWY_S3_USE_MINIO: ${APPFLOWY_S3_USE_MINIO}
      APPFLOWY_S3_MINIO_URL: ${APPFLOWY_S3_MINIO_URL}
      APPFLOWY_S3_ACCESS_KEY: ${APPFLOWY_S3_ACCESS_KEY}
      APPFLOWY_S3_SECRET_KEY: ${APPFLOWY_S3_SECRET_KEY}
      APPFLOWY_S3_REGION: ${APPFLOWY_S3_REGION}
      APPFLOWY_BACKUP_DEPLOYMENT: swarm
      APPFLOWY_BACKUP_SWARM_STACK: ${APPFLOWY_SWARM_STACK:-appflowy-swarm}
      APPFLOWY_BACKUP_RESTORE_DIRECTORY: /var/lib/appflowy-backup/restore
      APPFLOWY_BACKUP_SWARM_RUNTIME_DIRECTORY: /appflowy-deployment/backup-ops/swarm-runtime
      APPFLOWY_BACKUP_SEARCH_INDEX_DIR: /var/lib/appflowy/keyword_index
      APPFLOWY_BACKUP_SERVICE_SOCKET: /var/run/appflowy-backup/service.sock
      APPFLOWY_BACKUP_COORDINATOR_SOCKET: /var/run/appflowy-backup/coordinator.sock
    user: root
    entrypoint:
    - /bin/sh
    - -ec
    - 'test -d /var/lib/appflowy/keyword_index

      test ! -L /var/lib/appflowy/keyword_index

      chown postgres:postgres /var/lib/appflowy/keyword_index

      chmod u+rwx /var/lib/appflowy/keyword_index

      exec appflowy_backup "$$@"

      '
    - --
    command:
    - bootstrap
    stop_grace_period: 1500s
    volumes:
    - backup_work:/var/lib/appflowy-backup
    - backup_coordinator_socket:/var/run/appflowy-backup
    - keyword_index_data:/var/lib/appflowy/keyword_index
    - /var/run/docker.sock:/var/run/docker.sock
    - ${APPFLOWY_SWARM_BACKUP_RUNTIME_DIR:?Set the absolute Swarm backup runtime directory}:/appflowy-deployment/backup-ops/swarm-runtime
    deploy:
      replicas: 0
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: stop-first
      placement:
        constraints:
        - node.labels.appflowy.data == true
        - node.role == manager
volumes:
  backup_work: null
  backup_coordinator_socket: null
