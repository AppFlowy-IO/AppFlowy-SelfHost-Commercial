{{- if index .Values "appflowy-mcp" "enabled" }}
{{- $mcp := index .Values "appflowy-mcp" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "appflowy.mcp.fullname" . }}
  labels:
    {{- include "appflowy.labels" . | nindent 4 }}
    app.kubernetes.io/component: appflowy-mcp
spec:
  type: {{ $mcp.service.type }}
  ports:
    - port: {{ $mcp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "appflowy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: appflowy-mcp
{{- end }}
