# =============================================================================
# AppFlowy Cloud Helm Chart - Default Values
# =============================================================================
# This file contains the default configuration values for the AppFlowy Cloud
# Helm chart. See ../../ci/helm-values.yaml for the isolated CI profile.

# -----------------------------------------------------------------------------
# Global Configuration
# -----------------------------------------------------------------------------
global:
  # Domain configuration
  domain: "localhost"
  scheme: "http"
  wsScheme: "ws"

  # Computed URLs (using domain and scheme)
  # These are templates that will be resolved in _helpers.tpl

  # Image configuration
  imageRegistry: ""
  imagePullSecrets: []

  # Common labels applied to all resources
  labels: {}

  # Common annotations applied to all resources
  annotations: {}

  # PostgreSQL connection configuration
  postgresql:
    # Use internal PostgreSQL (from dependency) or external
    # When using external, set enabled: false in postgresql section
    host: ""  # Empty uses release-name-postgresql
    port: 5432
    database: "postgres"
    username: "postgres"
    # Password should be set via --set or existingSecret
    password: "password"
    # Use existing secret for credentials
    existingSecret: ""
    secretKeys:
      password: "postgres-password"

  # Redis connection configuration
  redis:
    # Use internal Redis (from dependency) or external
    host: ""  # Empty uses release-name-redis-master
    port: 6379
    password: ""
    existingSecret: ""
    secretKeys:
      password: "redis-password"

  # S3/MinIO configuration
  s3:
    useMinio: true
    # Endpoint for S3 API
    endpoint: ""  # Empty uses release-name-minio
    port: 9000
    bucket: "appflowy"
    region: "us-east-1"
    createBucket: true
    accessKey: "minioadmin"
    secretKey: "minioadmin"  # Should be set via --set or existingSecret
    existingSecret: ""
    secretKeys:
      accessKey: "root-user"
      secretKey: "root-password"
    # Presigned URL endpoint (external access)
    presignedUrlEndpoint: ""

  # JWT configuration (shared between GoTrue and AppFlowy Cloud)
  jwt:
    secret: "hello456"  # MUST be set - authentication will fail without this
    existingSecret: ""
    secretKey: "jwt-secret"
    expiration: 604800  # 7 days in seconds

# -----------------------------------------------------------------------------
# Infrastructure Dependencies
# -----------------------------------------------------------------------------

# PostgreSQL (Bitnami chart)
# https://github.com/bitnami/charts/tree/main/bitnami/postgresql
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: pg16
  auth:
    postgresPassword: "password"  # MUST be set
    database: postgres
  primary:
    # pgvector uses the official PostgreSQL entrypoint, not Bitnami scripts.
    # Preserve the existing chart PVC layout while using the image's postgres UID.
    podSecurityContext:
      fsGroup: 999
    containerSecurityContext:
      runAsUser: 999
      runAsGroup: 999
      readOnlyRootFilesystem: false
    extraEnvVars:
      - name: POSTGRES_DB
        value: '{{ .Values.auth.database }}'
    customLivenessProbe:
      exec:
        command: [sh, -ec, 'pg_isready -h 127.0.0.1 -U "${POSTGRES_USER:-postgres}" -d "$POSTGRES_DB"']
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
    customReadinessProbe:
      exec:
        command: [sh, -ec, 'pg_isready -h 127.0.0.1 -U "${POSTGRES_USER:-postgres}" -d "$POSTGRES_DB"']
      periodSeconds: 5
      timeoutSeconds: 5
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 500m
    initdb:
      scripts:
        init-extensions.sql: |
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;

# Redis (Bitnami chart)
# https://github.com/bitnami/charts/tree/main/bitnami/redis
redis:
  enabled: true
  image:
    tag: latest
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m

# MinIO (Bitnami chart)
# https://github.com/bitnami/charts/tree/main/bitnami/minio
minio:
  enabled: true
  image:
    repository: appflowyinc/minio
    tag: "RELEASE.2025-09-07T16-13-09Z"
  command:
    - minio
  args:
    - server
    - /bitnami/minio/data
    - --console-address
    - ":9001"
  auth:
    rootUser: minioadmin
    rootPassword: "minioadmin"  # MUST be set
  defaultBuckets: "appflowy"
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  service:
    type: ClusterIP
    ports:
      api: 9000
      console: 9001

# kube-prometheus-stack (Prometheus Operator + Grafana)
# https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
kube-prometheus-stack:
  enabled: false

# -----------------------------------------------------------------------------
# Application Services
# -----------------------------------------------------------------------------

# GoTrue Authentication Service
gotrue:
  enabled: true
  replicaCount: 1

  image:
    repository: appflowyinc/gotrue
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9999

  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  # GoTrue specific configuration
  config:
    # Admin credentials (created on first startup)
    adminEmail: "admin@example.com"
    adminPassword: "password"  # Should be set via secret

    # JWT settings (uses global.jwt by default)
    jwtExp: 604800

    # User registration
    disableSignup: false
    mailerAutoconfirm: true

    # Rate limiting
    rateLimitEmailSent: 100

    # SMTP configuration
    smtp:
      enabled: false
      host: ""
      port: 465
      user: ""
      password: ""  # From secret
      adminEmail: ""

    # OAuth providers
    oauth:
      google:
        enabled: false
        clientId: ""
        secret: ""  # From secret
      github:
        enabled: false
        clientId: ""
        secret: ""
      discord:
        enabled: false
        clientId: ""
        secret: ""
      apple:
        enabled: false
        clientId: ""
        secret: ""

    # SAML 2.0
    saml:
      enabled: false
      privateKey: ""

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Backup and restore coordinator. Requires an image containing the Kubernetes adapter.
# Support is limited to one replica per managed writer, without writer autoscalers or GitOps
# reconciliation during restore. See README.md before enabling on an existing installation.
appflowy-backup:
  enabled: false
  image:
    repository: appflowyinc/appflowy_backup
    tag: "0.20.2"
    digest: sha256:75a938425a8557d7fb9945b39b094bc66eb4b0058e8c3dd29cbce0f20c64daaf
    pullPolicy: IfNotPresent
  # Exact kubernetes.io/hostname shared with Search's local LMDB volume.
  nodeName: ""
  # API endpoint/Service CIDR as enforced by the cluster's NetworkPolicy provider.
  # Required when networkPolicy.enabled=true; use the actual IPv4 /32 or IPv6 /128.
  apiServerCIDR: ""
  persistence:
    size: 50Gi
    storageClass: ""
    existingClaim: ""
  artifacts:
    # Empty derives <source-bucket>-backups; this stays fixed across restores.
    bucket: ""
    prefix: server-backups/
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 2Gi}
  tolerations: []

# AppFlowy Cloud Main Backend Service
appflowy-cloud:
  enabled: true
  replicaCount: 1

  image:
    repository: appflowyinc/appflowy_cloud
    tag: "0.20.2"
    digest: sha256:1596f58b2c94059da6a3471a2fdb0a7eae8f11d143c44bb29260d490598fcf8b
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 1000m

  config:
    # Rust log level
    rustLog: "info"
    environment: "production"

    # Access control
    accessControl: true

    # Audit logging fallback for the switch in Admin -> Audit Log, used until Admin saves one.
    # Empty leaves it unset (off). The bundled appflowy-mcp service receives the same value.
    auditEnable: ""

    # WebSocket configuration
    websocketMailboxSize: 6000

    # Database connection pool
    databaseMaxConnections: 40

    # Collaboration settings
    collaborateMultiThread: false
    collaborateRemoveBatchSize: 100

    # Spam detection
    spamDetectEnabled: true

    # File auth
    fileAuthEnabled: true
    searchRequestTimeoutSecs: 10
    signupWhitelistEnabled: false
    guestInvitesRequireAdminApproval: false

    # Mailer SMTP (uses same as gotrue or separate)
    mailer:
      enabled: false
      host: ""
      port: 465
      username: ""
      email: ""
      password: ""
      tlsKind: "wrapper"

  # Metrics (Prometheus/Grafana)
  metrics:
    enabled: false
    path: /metrics
    portName: http
    # Add Prometheus scrape annotations to the service (optional)
    serviceAnnotations: {}
    # Create a ServiceMonitor (requires Prometheus Operator)
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
      # Override namespace for ServiceMonitor (defaults to release namespace)
      namespace: ""

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# AppFlowy Worker Service (Background Jobs)
appflowy-worker:
  enabled: true
  replicaCount: 1

  image:
    repository: appflowyinc/appflowy_worker
    tag: "0.20.2"
    digest: sha256:c95a43dc014a7a2c570f2d412a6bc0a7ca7de595574c2a7fba2ad53ee726ba9e
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 4001

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  config:
    rustLog: "info"
    environment: "production"
    importTickInterval: 30

  # Metrics (Prometheus/Grafana)
  metrics:
    enabled: false
    path: /metrics
    portName: http
    serviceAnnotations: {}
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
      namespace: ""

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# AppFlowy Search Service (keyword index and optional semantic indexing)
appflowy-search:
  enabled: true
  # One writer owns the persistent keyword index. Scaling requires a shared
  # index design; a PVC alone does not make multiple writers safe.
  replicaCount: 1
  image:
    repository: appflowyinc/appflowy_search
    tag: "0.20.2"
    digest: sha256:0d170a8a50fc2dde402f6fd4252de8a495515f5a19e0166179b1ee1ea409cf4e
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 4002
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  config:
    rustLog: info
    backgroundIndexerEnabled: true
    keywordSearchEnabled: true
    keywordWorkerEnabled: true
    keywordIndexMapSizeBytes: 2147483648
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# AppFlowy Web Frontend
appflowy-web:
  enabled: true
  replicaCount: 1

  image:
    repository: appflowyinc/appflowy_web
    tag: "0.20.1"
    digest: sha256:83e7fee360ce4ff87df75bceb4fec3d608b4f16f817aa75633b9e50d0a37d3c3
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  # The published image starts nginx as root and drops to its worker user.
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]
      add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE, DAC_OVERRIDE]
  livenessProbe: true
  readinessProbe: true

  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Admin Frontend
admin-frontend:
  enabled: true
  replicaCount: 1
  # The published entrypoint injects config into root-owned Next.js files.
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0

  image:
    repository: appflowyinc/admin_frontend
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

  config:
    pathPrefix: "/console"
    # OAuth settings for third-party integrations
    oauth:
      clientId: "appflowy_cloud"
      clientSecret: ""
      allowableRedirectUris: ""

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# AppFlowy AI Service
appflowy-ai:
  enabled: true
  replicaCount: 1

  image:
    repository: appflowyinc/appflowy_ai
    tag: "0.20.2"
    digest: sha256:d9ca0852a14d1c7dbbdbb4f2cb42f5e95547fb71286c4e9e351235f6052e4109
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5001

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 1000m

  config:
    # Default AI models
    defaultModel: "gpt-4.1-mini"
    defaultCompletionModel: "gpt-4.1-mini"

  # AI Provider API Keys (from secrets)
  secrets:
    openaiApiKey: ""
    anthropicApiKey: ""
    deepseekApiKey: ""
    deepseekApiBase: ""
    azureOpenaiApiKey: ""
    azureOpenaiEndpoint: ""
    azureOpenaiApiVersion: ""

  # Metrics (Prometheus/Grafana)
  metrics:
    enabled: false
    path: /metrics
    portName: http
    serviceAnnotations: {}
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
      namespace: ""

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# AppFlowy MCP Service (AI apps)
# AI apps such as Claude, ChatGPT, Cursor and Claude Code connect to <public origin>/mcp. The
# chart routes /mcp, /api/mcp and the OAuth/MCP discovery documents on global.domain to this
# service (see ingress.mcp), and Cloud advertises the origin to AppFlowy Web and Desktop.
appflowy-mcp:
  # false removes the bundled service. Set config.publicBaseUrl to the origin of an MCP service
  # deployed elsewhere. Left empty, Cloud gets no MCP origin and advertises no MCP, so AppFlowy
  # Web and Desktop hide their MCP settings.
  enabled: true
  replicaCount: 1
  # Must exceed MCP's 75-second shutdown drain (requests in flight, bounded by the 60-second
  # request timeout plus 5 s, then 5 s each for the policy watchers and the audit queue); open
  # GET /mcp streams end at once. Rendering fails otherwise.
  terminationGracePeriodSeconds: 90

  image:
    repository: appflowyinc/appflowy_mcp
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8002

  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m

  config:
    rustLog: "info"
    # MCP is on by default and needs a One, Team or Enterprise license. The Admin console's MCP
    # page turns it off or on, and the setting saved there always decides; no value here does.
    # Public origin without /mcp, which MCP, Cloud and AppFlowy Web all use. Empty uses
    # global.scheme://global.domain while enabled. It is also the OAuth issuer: changing it
    # makes every connected AI app reconnect. Remote AI apps such as claude.ai and ChatGPT need
    # a public HTTPS origin. With enabled: false, it is the origin of the MCP service deployed
    # elsewhere, and Cloud also receives oauthIpRateLimitPerMinute and the email allowlists
    # below, which must then match that service's own settings.
    publicBaseUrl: ""
    # Proxies whose X-Forwarded-For/X-Real-IP MCP trusts for its per-IP OAuth rate limit and
    # audit address. MCP believes only the right-most X-Forwarded-For entry, the one the proxy
    # appended or set, so ingress-nginx may replace the header (its default, which LDAP sign-in
    # needs) or append to it. Anything else inside these ranges that reaches MCP directly can
    # choose its own address: narrow this to the ingress controller's pod CIDR, and keep
    # networkPolicy.enabled. Empty trusts no proxy, so all clients share one address. Behind a
    # CDN or load balancer, have the controller resolve the client (use-forwarded-headers with
    # proxy-real-ip-cidr, see README.md), as LDAP's limit needs too.
    trustedProxyCidrs: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
    # Unauthenticated OAuth and client-registration requests per client IP per minute, until
    # Admin -> AI apps (MCP) sets a limit (1-10000; anything else, 0 included, stops MCP at
    # startup). Empty leaves the variable unset, so the built-in default (60) applies. Cloud
    # receives it too, for that page.
    oauthIpRateLimitPerMinute: ""
    # Optional server-wide client governance (comma-separated). Empty allows any dynamically
    # registered public PKCE client; workspace owners still approve apps for their workspace.
    allowedClientIds: ""
    allowedRedirectHosts: ""
    # Optional email allowlist fallbacks (comma-separated). Lists saved in Admin -> AI apps
    # (MCP) take precedence; empty lists allow every account.
    allowedEmailDomains: ""
    allowedEmails: ""
    # Browser origins other than global.domain that call MCP directly. Empty mirrors the
    # request origin; Web and Admin on global.domain need no entry.
    corsAllowedOrigins: ""
    # MCP keeps its own small pool rather than appflowy-cloud.config.databaseMaxConnections.
    databaseMaxConnections: 8
    databaseMinConnections: 1
    # Concurrent tool calls; at most 16 per pooled connection.
    maxInFlight: 128
    # Largest request body in bytes. A tool call carries what a model writes in one response,
    # well under 1 MiB. Every call in flight holds its parsed body, refused with 413 above twice
    # this size, so MCP logs an error at startup when maxInFlight x maxBodyBytes exceeds a
    # quarter of resources.limits.memory.
    maxBodyBytes: 1048576
    collabS3Threshold: 8000
    # Must match GoTrue's JWT audience.
    gotrueExpectedAudiences: "authenticated"

  # Metrics (Prometheus/Grafana). MCP always serves /metrics on its http port (in-flight and SSE
  # saturation, rate-limit denials, policy state); the MCP Ingress never publishes it.
  metrics:
    enabled: false
    path: /metrics
    serviceAnnotations: {}
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
      namespace: ""

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Ingress Configuration
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: "nginx"

  # cert-manager integration (optional)
  # When enabled, the chart will add the appropriate cert-manager issuer annotation to the Ingress.
  certManager:
    enabled: true
    issuerKind: "ClusterIssuer" # or "Issuer"
    issuerName: "letsencrypt-prod"

  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"

  scim:
    # Add /scim to the primary TLS Ingress. Disable this when SCIM is unused or
    # when the inherited annotations apply browser or external authentication.
    enabled: true

  # Separate Ingress for AI apps (MCP) on global.domain: exactly /mcp,
  # /.well-known/oauth-authorization-server and /.well-known/mcp.json, and /api/mcp and
  # /.well-known/oauth-protected-resource with their sub-paths, as anchored regexes (use-regex;
  # GoTrue's regex Ingress makes ingress-nginx match every path of the host as a regex prefix).
  # It inherits the annotations above except upstream-hash-by* and limit-* (browser affinity and
  # per-IP limits; set MCP's own in mcp.annotations) and always turns proxy buffering off.
  # Disable it when those annotations apply browser or external authentication, and route the
  # same paths to the MCP Service yourself.
  mcp:
    enabled: true
    # Extra annotations for this Ingress only.
    annotations: {}
    # Edge body ceiling; MCP enforces its own limit (appflowy-mcp.config.maxBodyBytes).
    bodySize: "8m"
    # GET /mcp holds a server-sent event stream open.
    proxyTimeoutSeconds: 3600

  tls:
    enabled: true
    secretName: "appflowy-tls"

  # Additional hosts (besides global.domain)
  extraHosts: []

# -----------------------------------------------------------------------------
# Network Policies
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: true
  # Allow traffic from ingress controller
  ingressControllerNamespace: "ingress-nginx"

# -----------------------------------------------------------------------------
# Service Account
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -----------------------------------------------------------------------------
# Pod Security Context (applied to all pods)
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
